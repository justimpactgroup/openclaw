name: Release

on: workflow_dispatch

concurrency: release

permissions:
  contents: read
  id-token: write # npm and ClawHub trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tip of main, not the dispatched commit, so a re-run finds the release tags.
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true # for the push below

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: npm run check:lockfile
      - run: npm ci

      - run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

      - name: Version, changelog and tag
        run: |
          npx nx release --skip-publish
          git push --follow-tags --atomic origin HEAD:main

      # Everything tagged at HEAD, so a re-run also publishes what failed before.
      - name: Publish to npm
        run: |
          projects=$(git tag --points-at HEAD --list '@justimpactgroup/*' | sed 's/@[^@]*$//' | paste -sd, -)
          if [ -n "$projects" ]; then npx nx release publish -p "$projects"; fi

      # Only needed until a package has a trusted publisher on ClawHub; the secret may be unset.
      - name: Log in to ClawHub
        run: if [ -n "$CLAWHUB_TOKEN" ]; then npx clawhub login --token "$CLAWHUB_TOKEN"; fi
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Publish to ClawHub
        run: npx nx run-many -t clawhub-publish --parallel=1
